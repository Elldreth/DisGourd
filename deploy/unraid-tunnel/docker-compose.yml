# DisGourd on Unraid behind a Cloudflare Tunnel (P11-05): no published ports,
# no router forwards. See README.md in this folder for the order of steps.
#
# Change these:
#   /mnt/user/appdata/disgourd-src         where you cloned the repo
#   /mnt/cache/appdata/disgourd            the database folder (fast local disk / cache)
#   /mnt/user/your-share/disgourd-uploads  the uploads folder
#   proxynet                               the network your other published services are on
#                                          (or drop it if the tunnel only serves DisGourd)
#   TUNNEL_TOKEN                           in a .env file next to this one
#
# Build the image first (Unraid's buildx is too old for `compose --build`):
#   cd /mnt/user/appdata/disgourd-src && DOCKER_BUILDKIT=0 docker build -t disgourd:latest .
# Then, from this folder:  docker compose up -d
#
# Secrets go in a .env file next to this one (chmod 600, never in git):
#   TUNNEL_TOKEN=...   (Cloudflare Zero Trust → Networks → Tunnels → your tunnel)

services:
  disgourd:
    image: disgourd:latest
    container_name: disgourd
    restart: unless-stopped
    user: "99:100"
    # Read-only root: it only writes /config, /uploads and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=3000
      - DB_PATH=/config/disgourd.db
      - UPLOADS_DIR=/uploads
      - REGISTRATION_MODE=closed
      # The first account (made with the setup code) is the site admin. Others:
      # - SITE_ADMINS=someone
      # Only cloudflared (on disgourd-edge, below) is a proxy we trust, and
      # Cloudflare's CF-Connecting-IP names the visitor.
      - TRUSTED_PROXIES=172.30.80.0/24
      - CLIENT_IP_HEADER=cf-connecting-ip
      # A voice relay (README step 7, optional): Cloudflare TURN.
      # - TURN_KEY_ID=your-turn-key-id
      # - TURN_KEY_TOKEN_FILE=/run/secrets/turn-key-token
    volumes:
      - /mnt/cache/appdata/disgourd:/config
      - /mnt/user/your-share/disgourd-uploads:/uploads
      # - ./secrets/turn-key-token:/run/secrets/turn-key-token:ro
    # No `ports:` at all. Only cloudflared reaches it, over disgourd-edge.
    networks:
      - disgourd-edge
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    # Pinned (update on purpose: see README.md). Was :latest.
    image: cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - NO_AUTOUPDATE=true
    # disgourd-edge reaches DisGourd; proxynet reaches any other services the
    # tunnel publishes.
    networks:
      - disgourd-edge
      - proxynet
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Only DisGourd and cloudflared, on a fixed subnet so TRUSTED_PROXIES can
  # name it. Created once by hand (README step 2), so a cloudflared that isn't
  # in this file can join it too:
  #   docker network create --subnet 172.30.80.0/24 disgourd-edge
  disgourd-edge:
    external: true
    name: disgourd-edge
  proxynet:
    external: true
    name: proxynet
