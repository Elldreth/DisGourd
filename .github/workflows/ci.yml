# Runs the server tests, the web tests + build and the Docker build on every pull
# request and on pushes to main. Node 22 matches the Dockerfile's base image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm test --prefix server

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web

  docker:
    name: Docker image builds and runs
    needs: [server, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # keep the image locally for the smoke test
          tags: disgourd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Runs it as 99:100 with host volumes: healthy, not root, data survives a
      # restart, and a root-owned volume fails clearly (see deploy/docker-smoke.sh).
      - run: bash deploy/docker-smoke.sh disgourd:ci
