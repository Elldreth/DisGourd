# DisGourd with Docker Compose: a generic starting point.
#   docker compose up -d --build
#
# Data lives in ./data next to this file. On first start the server prints a
# one-time setup code (docker logs disgourd); open the site and enter it to
# create the first account, which becomes the site admin.
#
# Recipes for specific setups, each with a "change these" list:
#   deploy/unraid-tunnel/  Unraid behind a Cloudflare Tunnel (no open ports)
#   deploy/swag/           Unraid (or any Docker host) behind SWAG / nginx
#   deploy/linux-vps/      a Linux VPS behind Caddy or a Cloudflare Tunnel
# Keep your own notes and real configs in ./local/ (git ignores it).

services:
  disgourd:
    build: .
    image: disgourd:latest
    container_name: disgourd
    restart: unless-stopped
    # The image runs as its own non-root user (1000:1000). To run as another
    # user (Unraid's nobody:users is "99:100"), set it here, and give that user
    # the data folders once:  chown -R 99:100 ./data
    # user: "99:100"
    # Hardening (P11-05): a read-only root (it only writes /config, /uploads
    # and /tmp), no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=3000
      - DB_PATH=/config/disgourd.db
      - UPLOADS_DIR=/uploads
      # open | code | closed. "code" (people need a code you make in Settings)
      # suits a server for friends; it's only the starting value.
      - REGISTRATION_MODE=code
      # The login token secret is generated on first start and kept in
      # /config/.jwt-secret. To set your own: JWT_SECRET=<openssl rand -hex 48>
      # Behind a reverse proxy, trust only its network (see deploy/):
      # - TRUSTED_PROXIES=172.30.80.0/24
      # Extra site admins by username (the first account already is one):
      # - SITE_ADMINS=someone
    volumes:
      # The database, its nightly backups (/config/backups) and the secrets.
      # Keep SQLite on fast local storage (not a network share).
      - ./data/config:/config
      # Uploaded files.
      - ./data/uploads:/uploads
    # No published port: put a reverse proxy or tunnel in front (see deploy/).
    # To try it on your LAN, uncomment (plain HTTP; never forward it at the
    # router):
    # ports:
    #   - "3000:3000"
